# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: SequentialAgent
name: trip_planner_agent
description: "Assists in planning a trip by finding flights, hotels, and summarizing the plan."
sub_agents:
  - config_path: find_flights_agent.yaml
  - config_path: find_hotels_agent.yaml
  - config_path: summarize_trip_agent.yaml