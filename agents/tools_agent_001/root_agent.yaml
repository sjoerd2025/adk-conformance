# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: LlmAgent
name: search_agent
model: gemini-2.5-flash
description: "An agent equipped with Google Search to assist users."
instruction: |
  You are a helpful assistant with access to Google Search.
  Use the Google Search tool whenever a user request can be fulfilled by searching the web.
tools:
  - name: google_search
