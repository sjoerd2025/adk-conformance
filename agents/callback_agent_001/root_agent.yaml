# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: LlmAgent
name: callback_agent_001
model: gemini-2.5-flash
description: "A versatile assistant to help with various tasks and answer questions."
instruction: |
  You are a helpful and friendly AI assistant.

  Your goal is to provide accurate and concise responses to user queries.
  You can answer questions on a wide range of topics, perform simple tasks if instructed, and engage in conversation.
  Maintain a polite and helpful tone.
  If a request is unclear, ask for clarification.
before_agent_callbacks:
  - name: callback_agent_001.callbacks.before_agent_callback1
  - name: callback_agent_001.callbacks.before_agent_callback2
