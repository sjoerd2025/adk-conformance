        - text: |-
            The Pythagorean theorem is a fundamental concept in geometry that describes the relationship between the three sides of a **right-angled triangle**.

            Here's a breakdown:

            1.  **Right-angled triangle**: This is a triangle where one of its angles measures exactly 90 degrees (a right angle).

            2.  **Sides of a right-angled triangle**:
                *   **Hypotenuse**: This is the longest side of the right-angled triangle, and it's always opposite the right angle.
                *   **Legs**: The other two sides are called legs.

            3.  **The Theorem**: The Pythagorean theorem states that in a right-angled triangle, the square of the length of the hypotenuse (let's call it 'c') is equal to the sum of the squares of the lengths of the other two sides (the legs, let's call them 'a' and 'b').

                This can be written as a formula:
                **a² + b² = c²**

            **In simpler terms:** If you draw squares on each side of a right-angled triangle, the area of the square on the hypotenuse is equal to the sum of the areas of the squares on the two legs.

            **Example:**
            Imagine a right-angled triangle where:
            *   One leg (a) is 3 units long.
            *   The other leg (b) is 4 units long.

            Using the Pythagorean theorem:
            3² + 4² = c²
            9 + 16 = c²
            25 = c²
            c = √25
            c = 5

            So, the hypotenuse (c) would be 5 units long.

            The Pythagorean theorem is incredibly useful for finding the length of an unknown side in a right-angled triangle if you know the lengths of the other two sides. It also helps to determine if a triangle is a right-angled triangle if you know all three side lengths.
