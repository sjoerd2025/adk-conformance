            - text: |-
                The Pythagorean theorem is a fundamental concept in geometry that describes the relationship between the three sides of a **right-angled triangle**.

                Here's a breakdown:

                1.  **Right-Angled Triangle:** This is a triangle that has one angle measuring exactly 90 degrees.

                2.  **Sides of the Triangle:**
                    *   **Hypotenuse:** This is the longest side of the right-angled triangle and is always opposite the right angle.
                    *   **Legs (or Cathetus):** These are the two shorter sides that form the right angle.

                3.  **The Theorem Itself:** The Pythagorean theorem states that in a right-angled triangle, the square of the length of the hypotenuse (c) is equal to the sum of the squares of the lengths of the other two sides (a and b).

                    In simpler terms, the formula is:
                    **a² + b² = c²**

                    Where:
                    *   `a` and `b` are the lengths of the two legs.
                    *   `c` is the length of the hypotenuse.

                **Example:**

                Imagine a right-angled triangle with:
                *   One leg (a) = 3 units
                *   The other leg (b) = 4 units

                To find the length of the hypotenuse (c), we use the theorem:

                3² + 4² = c²
                9 + 16 = c²
                25 = c²
                c = √25
                c = 5 units

                So, the hypotenuse is 5 units long.

                **When is it used?**

                *   To find the length of an unknown side of a right-angled triangle when you know the lengths of the other two sides.
                *   In various fields like construction, navigation, and engineering to calculate distances or verify right angles.

                Let me know if you'd like to try a practice problem!
