          parts:
            - text: |-
                The Pythagorean theorem is a fundamental concept in geometry that describes the relationship between the three sides of a right-angled triangle.

                Here's a breakdown:

                1.  **Right-angled triangle:** This is a triangle where one of its angles is exactly 90 degrees (a right angle).

                2.  **Sides of the triangle:**
                    *   **Hypotenuse:** This is the longest side of the right-angled triangle and is always opposite the right angle.
                    *   **Legs:** The other two sides are called legs.

                3.  **The Theorem:** The Pythagorean theorem states that in a right-angled triangle, the square of the length of the hypotenuse (let's call it 'c') is equal to the sum of the squares of the lengths of the other two sides (the legs, let's call them 'a' and 'b').

                    This can be written as an equation: **a² + b² = c²**

                **Let's break down the reasoning with an example:**

                Imagine a right-angled triangle with:
                *   Leg 'a' = 3 units long
                *   Leg 'b' = 4 units long
                *   Hypotenuse 'c' = ?

                Using the Pythagorean theorem:
                1.  Square the length of leg 'a': 3² = 9
                2.  Square the length of leg 'b': 4² = 16
                3.  Add these two squared values: 9 + 16 = 25
                4.  This sum (25) is equal to the square of the hypotenuse (c²).
                5.  To find 'c', take the square root of 25: √25 = 5

                So, the hypotenuse 'c' is 5 units long.

                **In essence, the theorem helps you:**
                *   Find the length of an unknown side of a right-angled triangle if you know the lengths of the other two sides.
                *   Determine if a triangle is a right-angled triangle if you know the lengths of all three sides (if a² + b² = c² holds true, then it's a right triangle).

                This theorem is incredibly useful in many areas, from construction and navigation to advanced physics and engineering.
