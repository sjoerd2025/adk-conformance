recordings:
  - user_message_index: 0
    agent_name: travel_planner
    llm_recording:
      llm_request:
        model: gemini-2.5-flash
        contents:
          - parts:
              - text: I need a round-trip flight from San Francisco to Tokyo, leaving March 15 and returning March 25. I prefer business class and direct flights only.
            role: user
        config:
          http_options:
            headers:
              x-goog-api-client: google-adk/1.16.0 gl-python/3.11.11
              user-agent: google-adk/1.16.0 gl-python/3.11.11
          system_instruction: |-
            You are a helpful travel planning assistant.

            Your role is to help users search for flights and calculate trip costs.

            When searching flights:
            - Always ask for origin, destination, and departure date
            - For round trips, also get the return date
            - Offer to customize preferences like cabin class, stops, and airlines
            - Use default preferences if user doesn't specify

            When calculating costs:
            - Get the base fare first
            - Ask if they want insurance or checked baggage
            - Clarify number of passengers if booking for multiple people
            - Provide a clear cost breakdown

            Be friendly and guide users through the booking process step by step.


            You are an agent. Your internal name is "travel_planner". The description about you is "A travel planning assistant for searching flights and calculating costs.".
          tools:
            - function_declarations:
                - description: "Search for flights based on trip details and preferences.\n\n  This function demonstrates advanced parameter handling:\n  - Pydantic models as parameters (trip, preferences)\n  - Optional/nullable parameters (preferences, return_date, preferred_airline)\n  - Default values (cabin_class, max_stops, flexible_dates)\n\n  Args:\n    trip: Core trip information including origin, destination, and dates.\n    preferences: Optional flight preferences. If not provided, uses defaults.\n\n  Returns:\n    A dictionary containing search results and parameters received.\n  "
                  name: search_flights
                  parameters:
                    properties:
                      trip:
                        properties:
                          origin:
                            type: STRING
                          destination:
                            type: STRING
                          departure_date:
                            type: STRING
                          return_date:
                            nullable: true
                            type: STRING
                        type: OBJECT
                      preferences:
                        nullable: true
                        type: OBJECT
                    required:
                      - trip
                    type: OBJECT
                  response:
                    type: OBJECT
                - description: "Calculate total trip cost with various optional charges.\n\n  This function demonstrates:\n  - Mix of required and optional parameters\n  - Default values for common cases\n  - Nullable parameter that affects calculation logic\n\n  Args:\n    base_fare: Base ticket price per passenger.\n    num_passengers: Number of passengers (default: 1).\n    insurance: Whether to add travel insurance (default: False).\n    baggage_count: Number of checked bags per passenger, or None for carry-on\n      only.\n\n  Returns:\n    A dictionary with cost breakdown.\n  "
                  name: calculate_trip_cost
                  parameters:
                    properties:
                      base_fare:
                        type: NUMBER
                      num_passengers:
                        default: 1
                        type: INTEGER
                      insurance:
                        default: false
                        type: BOOLEAN
                      baggage_count:
                        nullable: true
                        type: INTEGER
                    required:
                      - base_fare
                    type: OBJECT
                  response:
                    type: OBJECT
          labels:
            adk_agent_name: travel_planner
        live_connect_config:
          input_audio_transcription: {}
          output_audio_transcription: {}
