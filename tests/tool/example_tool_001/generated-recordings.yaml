recordings:
  - user_message_index: 0
    agent_name: example_tool_agent
    llm_recording:
      llm_request:
        model: gemini-2.5-flash
        contents:
          - parts:
              - text: The product is great, but the customer service is terrible.
            role: user
        config:
          http_options:
            headers:
              x-goog-api-client: google-adk/1.17.0 gl-python/3.10.19
              user-agent: google-adk/1.17.0 gl-python/3.10.19
          system_instruction: |-
            You are a sentiment analysis assistant. For each review, classify the sentiment as positive,
            negative, or neutral, and provide a brief explanation of your reasoning.


            You are an agent. Your internal name is "example_tool_agent". The description about you is "Demonstrates ExampleTool usage.".

            <EXAMPLES>
            Begin few-shot
            The following are examples of user queries and model responses using the available tools.

            EXAMPLE 1:
            Begin example
            [user]
            The battery life is amazing, but the screen is too dim outdoors.
            [model]
            Sentiment: Neutral. Reasoning: Mixed feedback - positive about battery, negative about screen.
            End example

            EXAMPLE 2:
            Begin example
            [user]
            Absolutely love this product! Best purchase I've made all year.
            [model]
            Sentiment: Positive. Reasoning: Enthusiastic praise with superlative language.
            End example

            EXAMPLE 3:
            Begin example
            [user]
            Broke after two days. Complete waste of money.
            [model]
            Sentiment: Negative. Reasoning: Product failure and explicit dissatisfaction.
            End example

            End few-shot
            <EXAMPLES>
          labels:
            adk_agent_name: example_tool_agent
        live_connect_config:
          input_audio_transcription: {}
          output_audio_transcription: {}
      llm_response:
        content:
          parts:
            - text: 'Sentiment: Neutral. Reasoning: The review has both positive feedback for the product and negative feedback for the customer service.'
          role: model
        finish_reason: STOP
        usage_metadata:
          candidates_token_count: 23
          candidates_tokens_details:
            - modality: TEXT
              token_count: 23
          prompt_token_count: 251
          prompt_tokens_details:
            - modality: TEXT
              token_count: 251
          thoughts_token_count: 40
          total_token_count: 314
          traffic_type: ON_DEMAND
        avg_logprobs: -0.9855124432107677
