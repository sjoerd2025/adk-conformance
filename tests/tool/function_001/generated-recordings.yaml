recordings:
  - user_message_index: 0
    agent_name: booking_assistant
    llm_recording:
      llm_request:
        model: gemini-2.5-flash
        contents:
          - parts:
              - text: |-
                  I want to create a booking for test@example.com. Please confirm the booking and add details: 'Conformance Test'.
            role: user
        config:
          http_options:
            headers:
              x-goog-api-client: google-adk/1.16.0 gl-python/3.11.11
              user-agent: google-adk/1.16.0 gl-python/3.11.11
          system_instruction: |-
            You are a booking assistant. You can help with:

            1.  Validating email addresses using the 'validate_email' tool.
            2.  Retrieving a user ID from an email using the 'get_user_id' tool.
            3.  Creating a new booking using the 'create_booking' tool, which requires a user ID, confirmation status, and details.

            Use the appropriate tool to fulfill the user's request.


            You are an agent. Your internal name is "booking_assistant". The description about you is "An agent for managing user bookings.".
          tools:
            - function_declarations:
                - description: Checks if the provided string is a valid email format.
                  name: validate_email
                  parameters:
                    properties:
                      email:
                        type: STRING
                    required:
                      - email
                    type: OBJECT
                  response:
                    type: BOOLEAN
                - description: Retrieves a user ID based on their email.
                  name: get_user_id
                  parameters:
                    properties:
                      email:
                        type: STRING
                    required:
                      - email
                    type: OBJECT
                  response:
                    type: INTEGER
                - description: "Creates a booking for a user.\n\n  Args:\n    user_id: The unique identifier for the user.\n    is_confirmed: Whether the booking is confirmed.\n    details: Any additional details for the booking.\n\n  Returns:\n    A dictionary containing the booking information and the types of the\n    received arguments.\n  "
                  name: create_booking
                  parameters:
                    properties:
                      user_id:
                        type: INTEGER
                      is_confirmed:
                        type: BOOLEAN
                      details:
                        type: STRING
                    required:
                      - user_id
                      - is_confirmed
                      - details
                    type: OBJECT
                  response:
                    type: OBJECT
          labels:
            adk_agent_name: booking_assistant
        live_connect_config:
          input_audio_transcription: {}
          output_audio_transcription: {}
